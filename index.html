<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23ff2d55'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__left">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <a href="#/" class="logo" aria-label="PremiumTube home">
        <span class="logo__mark"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>
        <span class="logo__text">PremiumTube</span>
        <span class="logo__badge">Premium</span>
      </a>
    </div>

    <form class="search" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search" aria-label="Search">
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      </button>
    </form>

    <div class="topbar__right">
      <span class="pill pill--glow">Ad-free look</span>
      <div class="avatar" title="You">P</div>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <a class="nav" href="#/" data-route="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-7h6v7h6V10z"/></svg><span>Home</span></a>
    <a class="nav" href="#/trending" data-route="trending"><svg viewBox="0 0 24 24"><path d="M12 23a7 7 0 0 0 7-7c0-3-2-5-3-7-1 1-2 2-3 2 0-3-1-6-4-9-1 4-4 6-4 11a7 7 0 0 0 7 10z"/></svg><span>Trending</span></a>
    <a class="nav" href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg><span>Watch later</span></a>
    <a class="nav" href="#/history" data-route="history"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4 2 .8-1.3-3.3-2V8z"/></svg><span>History</span></a>
    <hr>
    <div class="nav__title">Explore</div>
    <a class="nav" href="#/search?q=music" data-q="music"><svg viewBox="0 0 24 24"><path d="M12 3v10.6A4 4 0 1 0 14 17V7h4V3z"/></svg><span>Music</span></a>
    <a class="nav" href="#/search?q=gaming" data-q="gaming"><svg viewBox="0 0 24 24"><path d="M21 6H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM11 13H9v2H7v-2H5v-2h2V9h2v2h2zm4.5 1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg><span>Gaming</span></a>
    <a class="nav" href="#/search?q=sports" data-q="sports"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 0 1 6.3 3.1L12 10 5.7 7.1A8 8 0 0 1 12 4z"/></svg><span>Sports</span></a>
    <a class="nav" href="#/search?q=news" data-q="news"><svg viewBox="0 0 24 24"><path d="M4 4h14v16H4zm16 4h2v12a2 2 0 0 1-2 2H6v-2h14zM7 7v3h8V7zm0 5v2h8v-2z"/></svg><span>News</span></a>
    <div class="premium-card">
      <div class="premium-card__title">Premium perks</div>
      <ul><li>Distraction-free design</li><li>Theater mode</li><li>Watch later &amp; history</li></ul>
    </div>
  </nav>

  <main class="main" id="view"></main>
  <div class="toast" id="toast" role="status"></div>
  <div class="scrim" id="scrim"></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

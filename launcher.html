<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PremiumTube Launcher</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0f; color: #f4f4f8; font: 16px system-ui, sans-serif; }
    button { padding: 14px 28px; border: 0; border-radius: 999px; font: 700 16px system-ui, sans-serif; color: #fff; cursor: pointer; background: linear-gradient(90deg,#ff2d55,#ff7a45); box-shadow: 0 10px 30px rgba(255,45,85,.4); }
    p { color: #9a9aab; font-size: 13px; text-align: center; max-width: 380px; min-height: 1.4em; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <button id="go">Launch PremiumTube</button>
    <p id="msg">Opens in an about:blank tab.</p>
  </div>
  <script>
(function () {
  // index.html pulls its own CSS/JS from raw GitHub, so the launcher only needs index.html itself.
  var RAW_INDEX = 'https://raw.githubusercontent.com/AniItsukiCoded/ytfreemium/refs/heads/main/index.html';

  function get(url) {
    return fetch(url + '?t=' + Date.now()).then(function (r) {
      if (!r.ok) throw new Error(url + ' returned HTTP ' + r.status);
      return r.text();
    });
  }

  window.launchPremiumTube = function (status) {
    var say = status || function () {};
    var w = window.open('about:blank', '_blank');
    if (!w) { say('Popup blocked. Allow popups for this page and try again.'); return; }
    w.document.title = 'PremiumTube';
    say('Loading files from GitHub…');
    get(RAW_INDEX).then(function (html) {
      w.document.open();
      w.document.write(html); // index.html then fetches css/ and js/ from raw GitHub itself
      w.document.close();
      say('Opened.');
    }).catch(function (e) {
      w.close();
      say('Could not load: ' + e.message);
    });
  };
})();
  </script>
  <script>
    document.getElementById('go').onclick = function () {
      var msg = document.getElementById('msg');
      window.launchPremiumTube(function (t) { msg.textContent = t; });
    };
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launcher</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b0f; color: #f4f4f8; font: 16px system-ui, sans-serif; }
    button { padding: 14px 28px; border: 0; border-radius: 999px; font: 700 16px inherit; color: #fff; cursor: pointer; background: linear-gradient(90deg,#ff2d55,#ff7a45); box-shadow: 0 10px 30px rgba(255,45,85,.4); }
    p { color: #9a9aab; font-size: 13px; text-align: center; max-width: 360px; }
  </style>
</head>
<body>
  <div style="text-align:center">
    <button id="go">Launch PremiumTube</button>
    <p id="msg">Opens in an about:blank tab.</p>
  </div>
  <script>
    // EDIT THIS: raw link to premiumtube.html in your repo
    // (GitHub → premiumtube.html → "Raw" button → copy the URL)
    var RAW = 'https://raw.githubusercontent.com/YOUR-USERNAME/YOUR-REPO/main/premiumtube.html';

    document.getElementById('go').onclick = function () {
      var msg = document.getElementById('msg');
      var w = window.open('about:blank', '_blank');
      if (!w) { msg.textContent = 'Popup blocked. Allow popups for this page and try again.'; return; }
      msg.textContent = 'Loading…';
      fetch(RAW + (RAW.indexOf('?') < 0 ? '?t=' + Date.now() : ''))
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (html) {
          w.document.open();
          w.document.write(html);
          w.document.close();
          msg.textContent = 'Opened.';
        })
        .catch(function (e) { w.close(); msg.textContent = 'Could not load: ' + e.message + '. Check the RAW link.'; });
    };
  </script>
</body>
</html>
